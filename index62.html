<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
</head>

<body>

    <h2>Digital Clock</h2>

    <h1 id="clock"></h1>

    <script>
        function showTime() {
            let time = new Date();

            let hours = time.getHours();
            let minutes = time.getMinutes();
            let seconds = time.getSeconds();

            document.getElementById("clock").innerHTML =
                hours + ":" + minutes + ":" + seconds;
        }

        setInterval(showTime, 1000);

        showTime();
    </script>

</body>
</html>
